<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mart</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="#products">Products</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <div class="cart">
            <button onclick="toggleCart()">
                <img src="cart.png" alt="Cart"> (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>
    
    <div class="banner">
        <h2 class="welcome">Welcome to Mart</h2>
    </div>
    
    <section id="products">
        <!-- 10 Products listed here -->
        <div class="product">
            <img src="product1.jpg" alt="Product 1">
            <h3>Bottle</h3>
            <p>$10</p>
            <button onclick="addToCart('Bottle', 10, 'product1.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product2.jpg" alt="Product 2">
            <h3>Bottle</h3>
            <p>$20</p>
            <button onclick="addToCart('Bottle', 20, 'product2.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product3.jpg" alt="Product 3">
            <h3>Hoodie</h3>
            <p>$30</p>
            <button onclick="addToCart('Hoodie', 30, 'product3.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product4.jpg" alt="Product 4">
            <h3>Hoodie</h3>
            <p>$40</p>
            <button onclick="addToCart('Hoodie', 40, 'product4.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product5.jpg" alt="Product 5">
            <h3>Iphone</h3>
            <p>$50</p>
            <button onclick="addToCart('Iphone', 50, 'product5.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product6.jpg" alt="Product 6">
            <h3>Durex</h3>
            <p>$60</p>
            <button onclick="addToCart('Durex', 60, 'product6.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product7.jpg" alt="Product 7">
            <h3>Charger</h3>
            <p>$70</p>
            <button onclick="addToCart('Charger', 70, 'product7.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product8.jpg" alt="Product 8">
            <h3>Bra</h3>
            <p>$80</p>
            <button onclick="addToCart('Bra', 80, 'product8.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product9.jpg" alt="Product 9">
            <h3>T-shirt</h3>
            <p>$90</p>
            <button onclick="addToCart('T-shirt', 90, 'product9.jpg')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="product10.jpg" alt="Product 10">
            <h3>Jeans</h3>
            <p>$100</p>
            <button onclick="addToCart('Jeans', 100, 'product10.jpg')">Add to Cart</button>
        </div>
    </section>
    
    <div id="cart" class="hidden">
        <h2>Shopping Cart</h2>
        <ul id="cart-items"></ul>
        <div id="cart-total"></div>
        <button onclick="checkout()">Checkout</button>
    </div>
    
    <footer>
        &copy; 2025 My Shop. All rights reserved.
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
